<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>업무 달력</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <!-- date-fns 를 브라우저에서 'date-fns' 로 해석. 로컬 동봉본을 써서 네트워크
       없이도 동작한다. 같은 specifier 가 node 에서는 node_modules 로 잡혀,
       달력 로직 테스트가 실제 코드를 그대로 검증한다. -->
  <script type="importmap">
    {
      "imports": {
        "date-fns": "./vendor/date-fns.js"
      }
    }
  </script>
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">업무 달력</span>
    </div>

    <nav class="period-nav" aria-label="기간 이동">
      <button id="today" class="btn-ghost" type="button">오늘</button>
      <button id="prev" class="btn-step" type="button" aria-label="이전">‹</button>
      <h1 id="period" class="period" aria-live="polite">—</h1>
      <button id="next" class="btn-step" type="button" aria-label="다음">›</button>
    </nav>

    <div class="bar-end">
      <div class="view-toggle" role="tablist" aria-label="보기 전환">
        <button id="view-month" class="seg" role="tab" type="button" aria-selected="false">월</button>
        <button id="view-week" class="seg" role="tab" type="button" aria-selected="true">주</button>
      </div>
      <div id="auth-area" class="auth-area"></div>
      <button id="add" class="btn-primary" type="button">일정 더하기</button>
    </div>
  </header>

  <main id="cal-root" class="cal-root" tabindex="-1"></main>

  <!-- 일정 입력 / 수정 -->
  <dialog id="form-dialog" class="sheet">
    <form id="event-form">
      <header class="sheet-head">
        <h2 id="form-title">새 일정</h2>
        <button type="button" id="form-close" class="btn-step" aria-label="닫기">×</button>
      </header>

      <div class="sheet-body">
        <label class="field">
          <span class="field-label">내용</span>
          <input name="title" type="text" required placeholder="무엇을 하나요?" autocomplete="off" />
        </label>

        <fieldset class="field time-field">
          <span class="field-label">시간</span>
          <label class="inline-check">
            <input type="checkbox" name="allDay" /> 종일
          </label>
          <div class="time-grid">
            <input name="date" type="date" required aria-label="날짜" />
            <input name="start" type="time" aria-label="시작 시간" />
            <span class="time-dash" aria-hidden="true">–</span>
            <input name="end" type="time" aria-label="종료 시간" />
          </div>
        </fieldset>

        <div class="row-2">
          <label class="field">
            <span class="field-label">분류</span>
            <select name="category">
              <option value="회의">회의</option>
              <option value="출장">출장</option>
              <option value="기타">기타</option>
            </select>
          </label>
          <div class="field priority-field">
            <span class="field-label">우선순위</span>
            <label class="inline-check">
              <input type="checkbox" name="priority" /> 우선 처리
            </label>
          </div>
        </div>

        <div class="row-2">
          <label class="field">
            <span class="field-label">장소</span>
            <input name="location" type="text" placeholder="회의실 · 외부" autocomplete="off" />
          </label>
          <label class="field">
            <span class="field-label">담당부서</span>
            <input name="department" type="text" placeholder="주관 부서" autocomplete="off" />
          </label>
        </div>

        <fieldset class="field">
          <span class="field-label">참석자</span>
          <div id="attendee-list" class="attendee-list"></div>
          <button type="button" id="add-attendee" class="btn-ghost btn-sm">+ 참석자</button>
          <p class="hint">본부장은 직책 체크 시 파랑·굵게·라벨로 표시됩니다.</p>
        </fieldset>
      </div>

      <footer class="sheet-foot">
        <button type="button" id="form-delete" class="btn-danger" hidden>삭제</button>
        <span class="spacer"></span>
        <button type="button" id="form-cancel" class="btn-ghost">취소</button>
        <button type="submit" class="btn-primary">저장</button>
      </footer>
    </form>
  </dialog>

  <!-- 일정 상세 -->
  <dialog id="detail-dialog" class="sheet">
    <div class="detail" id="detail-body"></div>
  </dialog>

  <!-- 로그인 -->
  <dialog id="login-dialog" class="sheet">
    <form id="login-form">
      <header class="sheet-head">
        <h2>로그인</h2>
        <button type="button" id="login-close" class="btn-step" aria-label="닫기">×</button>
      </header>
      <div class="sheet-body">
        <p class="hint">일정을 만들거나 고치려면 로그인하세요. 보기는 로그인 없이 됩니다.</p>
        <label class="field">
          <span class="field-label">아이디</span>
          <input name="username" type="text" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span class="field-label">비밀번호</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="login-error" id="login-error" role="alert" hidden></p>
      </div>
      <footer class="sheet-foot">
        <span class="spacer"></span>
        <button type="button" id="login-cancel" class="btn-ghost">취소</button>
        <button type="submit" class="btn-primary">로그인</button>
      </footer>
    </form>
  </dialog>

  <!-- 사용자 관리 (관리자 전용) -->
  <dialog id="users-dialog" class="sheet">
    <header class="sheet-head">
      <h2>사용자 관리</h2>
      <button type="button" id="users-close" class="btn-step" aria-label="닫기">×</button>
    </header>
    <div class="sheet-body">
      <ul id="users-list" class="users-list"></ul>
      <form id="user-add-form" class="user-add">
        <span class="field-label">사용자 추가</span>
        <div class="user-add-row">
          <input name="username" type="text" placeholder="아이디" autocomplete="off" required />
          <input name="password" type="password" placeholder="비밀번호" autocomplete="new-password" required />
          <label class="inline-check"><input type="checkbox" name="isAdmin" /> 관리자</label>
          <button type="submit" class="btn-primary btn-sm">추가</button>
        </div>
        <p class="users-error" id="users-error" role="alert" hidden></p>
      </form>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
